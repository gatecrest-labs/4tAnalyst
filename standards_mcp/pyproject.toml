[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "standards-mcp"
version = "0.1.0"
description = "Standards MCP server — zone matrix, naming conventions, review requirements"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0,<3.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
standards-mcp = "standards_mcp.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["standards_mcp"]
