[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hygiene-mcp"
version = "0.1.0"
description = "Rule Hygiene fix assessment MCP server — parses hygiene findings and computes deterministic FortiGate CLI remediation"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
hygiene-mcp = "hygiene_mcp.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["hygiene_mcp"]
