[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feedback-mcp"
version = "0.1.0"
description = "Feedback MCP server — engineer decision capture, similarity lookup, and audit logging"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
feedback-mcp = "feedback_mcp.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["feedback_mcp"]
