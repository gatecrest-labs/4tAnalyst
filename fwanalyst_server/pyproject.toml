[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fwanalyst-server"
version = "0.1.0"
description = "Unified authenticated MCP server for 4tAnalyst (all tools + deterministic change planner)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
    "fastapi>=0.111",
    "python-multipart>=0.0.9",
    "psutil>=6.0",
    "bcrypt>=4.0",
    "itsdangerous>=2.0",
    "jinja2>=3.0",
]

[project.scripts]
4tanalyst-admin = "fwanalyst_server.admin_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fwanalyst_server"]
