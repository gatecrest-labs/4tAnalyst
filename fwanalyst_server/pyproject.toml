[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fwanalyst-server"
version = "0.1.0"
description = "Unified authenticated MCP server for 4tAnalyst (all tools + deterministic change planner)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["fwanalyst_server"]
