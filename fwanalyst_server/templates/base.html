<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4tAnalyst Admin{% block title_suffix %}{% endblock %}</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
<nav class="navbar">
  <span class="navbar-brand">
    <svg class="brand-mark" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="30" cy="70" r="36" stroke="#eef1f4" stroke-width="3" opacity=".18" fill="none"/>
      <circle cx="30" cy="70" r="25" stroke="#eef1f4" stroke-width="3" opacity=".3" fill="none"/>
      <circle cx="30" cy="70" r="14" stroke="#eef1f4" stroke-width="3" opacity=".5" fill="none"/>
      <circle cx="30" cy="70" r="9" fill="#eef1f4"/>
      <line x1="37" y1="63" x2="64" y2="36" stroke="#eef1f4" stroke-width="2.2" stroke-dasharray="1 5" stroke-linecap="round"/>
      <circle cx="70" cy="26" r="8" stroke="#e08a2c" stroke-width="3.4" fill="none"/>
      <line x1="76" y1="32" x2="81" y2="37" stroke="#e08a2c" stroke-width="3.4" stroke-linecap="round"/>
    </svg>
    4tAnalyst
  </span>
  <div class="nav-links">
    <a href="/admin/dashboard"{% if active_tab == 'dashboard' %} class="active"{% endif %}>Dashboard</a>
    <a href="/admin/graph"{% if active_tab == 'graph' %} class="active"{% endif %}>Usage Analytics</a>
    {% if user.role == 'admin' %}
    <a href="/admin/adoms"{% if active_tab == 'adoms' %} class="active"{% endif %}>Admin</a>
    {% endif %}
  </div>
  <div class="nav-user">
    {{ user.username }} ({{ user.role }})
    &nbsp;<a href="/admin/logout">Logout</a>
  </div>
</nav>
<main>{% block content %}{% endblock %}</main>
<script src="/admin/static/chart.min.js"></script>
<script src="/admin/static/admin.js"></script>
</body>
</html>
