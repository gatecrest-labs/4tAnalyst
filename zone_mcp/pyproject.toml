[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zone-mcp"
version = "0.1.0"
description = "4THealth zone policy MCP server — IP-to-zone resolution and traffic verdicts"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.30.0,<2.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

[project.scripts]
zone-mcp = "zone_mcp.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["zone_mcp"]
