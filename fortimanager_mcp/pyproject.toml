[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fortimanager-mcp"
version = "0.1.0"
description = "FortiManager MCP server — read-only policy and object queries (7.4.x / 7.6.x)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.scripts]
fortimanager-mcp = "fortimanager_mcp.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["fortimanager_mcp"]
